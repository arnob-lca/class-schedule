<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Class Schedule</title>
    <link rel="stylesheet" href="./assets/css/reset.css">
    <link rel="stylesheet" href="./assets/css/user.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body>

    <div class="login-bg">
        <div class="login-card" id="login-card">

            <!-- Brand -->
            <div class="login-brand" id="login-brand">
                <div class="brand-mark"><span></span></div>
                <h2>welcome back</h2>
                <p>sign in to continue</p>
            </div>

            <!-- Form -->
            <div id="login-form">
                <div class="field-group">
                    <label>username</label>
                    <input type="text" id="username" placeholder="enter your username" autocomplete="off" />
                    <div class="field-icon">
                        <svg viewBox="0 0 16 16" fill="none" stroke="#444" stroke-width="1.2">
                            <circle cx="8" cy="5" r="3" />
                            <path d="M2 13c0-3 2.5-5 6-5s6 2 6 5" />
                        </svg>
                    </div>
                    <div class="err-msg" id="user-err">username is required</div>
                </div>

                <div class="field-group">
                    <label>password</label>
                    <input type="password" id="password" placeholder="enter your password" />
                    <div class="field-icon" id="eye-btn">
                        <svg id="eye-icon" viewBox="0 0 16 16" fill="none" stroke="#444" stroke-width="1.2">
                            <ellipse cx="8" cy="8" rx="6" ry="4" />
                            <circle cx="8" cy="8" r="1.8" />
                        </svg>
                    </div>
                    <div class="err-msg" id="pass-err">password is required</div>
                </div>

                <div class="forgot">
                    <a href="#">forgot password?</a>
                </div>

                <button class="login-btn" id="login-btn" onclick="handleLogin()">
                    sign in
                </button>

                <div class="status-bar" id="status-bar"></div>
            </div>

            <!-- Success Screen -->
            <div class="success-screen" id="success-screen">
                <div class="check-circle">
                    <svg viewBox="0 0 24 24" fill="none" stroke="#1D9E75" stroke-width="1.5">
                        <polyline points="4,12 9,17 20,6" />
                    </svg>
                </div>
                <h3>access granted</h3>
                <p id="welcome-msg">welcome back</p>
            </div>

        </div>
    </div>

    <script>
        /*USERS object */
        const USERS = {
            "arnob12":   "pass123",
        };

        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');

        usernameInput.addEventListener('input', () => {
            document.getElementById('user-err').classList.remove('show');
            usernameInput.classList.remove('error-field');
            document.getElementById('status-bar').className = 'status-bar';
        });

        passwordInput.addEventListener('input', () => {
            document.getElementById('pass-err').classList.remove('show');
            passwordInput.classList.remove('error-field');
            document.getElementById('status-bar').className = 'status-bar';
        });

        usernameInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') passwordInput.focus();
        });

        passwordInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') handleLogin();
        });

        document.getElementById('eye-btn').addEventListener('click', () => {
            const isPass = passwordInput.type === 'password';
            passwordInput.type = isPass ? 'text' : 'password';
            document.getElementById('eye-icon').innerHTML = isPass
                ? `<ellipse cx="8" cy="8" rx="6" ry="4"/><line x1="2" y1="2" x2="14" y2="14"/>`
                : `<ellipse cx="8" cy="8" rx="6" ry="4"/><circle cx="8" cy="8" r="1.8"/>`;
        });

        function showErr(id, msg) {
            const el = document.getElementById(id);
            el.textContent = msg;
            el.classList.add('show');
            const input = id === 'user-err' ? usernameInput : passwordInput;
            input.classList.add('error-field');
        }

        function showStatus(msg, type) {
            const bar = document.getElementById('status-bar');
            bar.textContent = msg;
            bar.className = 'status-bar ' + type;
        }

        function showSuccess(username) {
            const btn = document.getElementById('login-btn');
            btn.disabled = true;
            btn.innerHTML = `logging in <span class="loading-dots">
                <span></span><span></span><span></span>
            </span>`;

            /* session save */
            sessionStorage.setItem('loggedIn', 'true');
            sessionStorage.setItem('username', username);

            /*schedule page এ redirect */
            setTimeout(() => {
                window.location.href = "./index.html";
            }, 1400);
        }

        function handleLogin() {
            const u = usernameInput.value.trim().toLowerCase(); /*lowercase */
            const p = passwordInput.value;
            let valid = true;

            if (!u) { showErr('user-err', 'username is required'); valid = false; }
            if (!p) { showErr('pass-err', 'password is required'); valid = false; }
            if (!valid) return;

            document.getElementById('status-bar').className = 'status-bar';

            if (USERS[u] === p) {
                usernameInput.classList.add('success-field');
                passwordInput.classList.add('success-field');
                showSuccess(u);
            } else if (USERS[u] !== undefined) {
                showErr('pass-err', 'wrong password');
                showStatus('incorrect password — try again', 'error');
            } else {
                showErr('user-err', 'username not found');
                showStatus('user not found — check credentials', 'error');
            }
        }
    </script>

</body>
</html>
